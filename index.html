<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />

        <script>
            if (
                window.location.pathname ===
                "/"
            ) {
                document.documentElement.classList.add(
                    "home-initial-loading",
                );
            }
        </script>

        <style>
            html,
            body,
            #root {
                margin: 0;
                width: 100%;
                height: 100%;
            }

            body {
                background: #f8f7f4;
            }

            /*
             * Home 첫 진입에서만
             * 중간 렌더링을 사용자에게 보여주지 않는다.
             */
            html.home-initial-loading #root {
                visibility: hidden;
            }
        </style>

        <link
            rel="icon"
            type="image/png"
            href="/apple-touch-icon.png"
        />

        <link
            rel="apple-touch-icon"
            href="/apple-touch-icon.png"
        />

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <title>Maggie's Garden</title>
    </head>

    <body>
        <div id="root"></div>

        <script
            type="module"
            src="/src/main.jsx"
        ></script>
    </body>
</html>
