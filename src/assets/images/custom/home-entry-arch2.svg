<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400" role="img" aria-labelledby="title desc">
  <title id="title">Home Entry Arch</title>
  <desc id="desc">Muted olive green pointed arch with a cream chevron, botanical line art, and sparkles on a transparent background.</desc>
  <defs>
    <linearGradient id="archFill" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#7B8868"/>
      <stop offset="48%" stop-color="#6F7D5D"/>
      <stop offset="100%" stop-color="#667454"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#F7F2E4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F7F2E4" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Transparent outer background by design -->
  <path d="M150 1360V535C150 345 259 192 450 40C641 192 750 345 750 535V1360Z"
